name: Synthetic checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      SCHEDULER_ENABLED: 'false'
      AI_PROVIDER: none
      AI_API_KEY: ''
      AI_ENCRYPTION_KEY: ''
      DATA_ENCRYPTION_KEY: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Disposable SQLite migrations (PostgreSQL explicitly not covered)
        run: python scripts/verify-migrations.py --sqlite-only
      - name: Native frontend contracts
        run: |
          node scripts/test-period-context.cjs
          node scripts/test-demo-examples.cjs
          node scripts/test-campaign-labels.cjs
          for file in app/static/*.js; do node --check "$file"; done
