services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: legalgrowth
      POSTGRES_USER: legalgrowth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U legalgrowth]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports:
      - 127.0.0.1:8000:8000
    environment:
      DATABASE_URL: postgresql+psycopg://legalgrowth:${POSTGRES_PASSWORD}@db:5432/legalgrowth
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Execute init primeiro}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-}
      APP_ENV: production
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      REPORT_DAY: ${REPORT_DAY:-mon}
      REPORT_HOUR: ${REPORT_HOUR:-9}
      REPORT_MINUTE: ${REPORT_MINUTE:-0}
      TIMEZONE: America/Sao_Paulo
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:?Configure uma chave Fernet para proteger as credenciais de IA}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Configure uma chave Fernet separada e persistente para os nomes locais}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
