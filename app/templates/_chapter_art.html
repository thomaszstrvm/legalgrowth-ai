{# The chapter repeats its cover engraving; small variants retain the silhouette. #}
{% from '_dossier_art.html' import dossier_art %}
{% macro chapter_art(chapter, class_name, compact=false) -%}
{% if not compact %}
{{ dossier_art(chapter, class_name) }}
{% else %}
<svg class="{{ class_name }}" viewBox="0 0 240 240" fill="none" aria-hidden="true" focusable="false">
  {% if chapter in ['overview','campaigns'] %}
  <path d="M16 28H224V58C132 58 70 109 70 198H224V220H16Z" fill="currentColor"/>
  <path d="M104 198C104 129 156 88 224 88M138 198C138 155 173 120 224 120M172 198C172 174 191 154 224 154" stroke="currentColor" stroke-width="5"/>
  {% elif chapter == 'finance' %}
  <path d="M12 22H224L185 91H62V190H12ZM104 116H152V162H224V220H48Z" fill="currentColor"/>
  {% elif chapter in ['reports','contracts'] %}
  <path d="M24 68L168 14L216 66L72 120ZM28 212L172 158L216 184L72 236Z" stroke="currentColor" stroke-width="5"/>
  <path d="M72 120L216 66L172 158L28 212Z" fill="currentColor"/>
  {% elif chapter in ['insights','agents'] %}
  <path d="M20 174C28 78 104 14 220 24C215 130 142 216 20 224Z" fill="currentColor"/>
  <path d="M43 205C38 109 125 40 203 45M73 193C63 112 114 64 191 77M103 181C88 118 102 88 179 109" stroke="var(--paper)" stroke-width="6"/>
  <path d="M14 150L224 70L218 105L16 182Z" fill="var(--paper)"/>
  {% elif chapter in ['strategy','news','market'] %}
  <path d="M12 20H67V120L128 181H228V224H105L12 131ZM98 20H135V80L182 128H228V166H165L98 99Z" fill="currentColor"/>
  <path d="M170 20V59L211 100H228M201 20V48L228 75" stroke="currentColor" stroke-width="5"/>
  {% else %}
  <path d="M26 18H94V150H222V218H26Z" fill="currentColor"/>
  <path d="M114 18V130H222" stroke="currentColor" stroke-width="5"/>
  {% endif %}
</svg>
{% endif %}
{%- endmacro %}
